name: planb-build-smoke
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tag:
          - gwtbootstrap3-gwtbootstrap3-92837490
          - brettwooldridge-HikariCP-158059986
          - yasserg-crawler4j-265972564
          - davidmoten-rxjava-jdbc-82056062
          - joel-costigliola-assertj-core-209468547
          - raphw-byte-buddy-156948936
          - google-auto-101506035
          - rinde-RinSim-52440885
          - ImmobilienScout24-deadcode4j-110208140
          - square-okio-201546728
    steps:
      - name: pull (cached then fallback)
        run: |
          set +e
          echo "--- cached ---"
          docker pull bugswarm/cached-images:${{ matrix.tag }}
          c=$?
          echo "cached_exit=$c"
          img=""
          if [ "$c" -eq 0 ]; then
            img="bugswarm/cached-images:${{ matrix.tag }}"
            docker image inspect "$img" --format 'cached_size_bytes={{.Size}}' || true
          else
            echo "--- fallback ---"
            docker pull bugswarm/images:${{ matrix.tag }}
            f=$?
            echo "fallback_exit=$f"
            if [ "$f" -eq 0 ]; then
              img="bugswarm/images:${{ matrix.tag }}"
              docker image inspect "$img" --format 'fallback_size_bytes={{.Size}}' || true
            fi
          fi
          if [ -z "$img" ]; then
            echo "PULL_FAILED tag=${{ matrix.tag }}"
            exit 1
          fi
          echo "IMAGE=$img" >> "$GITHUB_ENV"

      - name: run_failed
        run: |
          set +e
          docker run --privileged --rm -i "$IMAGE" /bin/bash -lc 'bash /usr/local/bin/run_failed.sh; echo EXIT=$?' > failed.log 2>&1
          echo "docker_exit=$?"
          tail -60 failed.log

      - name: run_passed
        run: |
          set +e
          docker run --privileged --rm -i "$IMAGE" /bin/bash -lc 'bash /usr/local/bin/run_passed.sh; echo EXIT=$?' > passed.log 2>&1
          echo "docker_exit=$?"
          tail -60 passed.log

      - name: classify failed.log (priority rules, INFRA scoped to error lines)
        run: |
          set +e
          # INFRA: keywords only inside error-context lines ([ERROR]/Caused by:)
          infra=$(cat failed.log | grep -E '^\[ERROR\]|^Caused by:' | grep -cE 'Could not transfer|PKIX|Connection|timeout' || true)
          plugin=$(grep -c 'Failed to execute goal org.apache.maven.plugins:maven-' failed.log || true)
          tool=0
          grep -qE 'UnsupportedClassVersionError|Unsupported major.minor version|invalid target release|No compiler is provided' failed.log && tool=1
          testfail=$(grep -E 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+' failed.log | awk '{f=0;e=0; for(i=1;i<=NF;i++){if($i=="Failures:")f=$(i+1)+0; if($i=="Errors:")e=$(i+1)+0} if(f>0||e>0){print "y"; exit}}' | wc -l)

          class=UNKNOWN
          if [ "$infra" -gt 0 ]; then
            class=INFRA
          elif grep -q 'COMPILATION ERROR' failed.log; then
            class=COMPILE
          elif grep -qE 'Could not resolve dependencies|Non-resolvable parent POM' failed.log; then
            class=DEPENDENCY
          elif [ "$tool" -eq 1 ]; then
            class=TOOLCHAIN
          elif [ "$testfail" -gt 0 ] && [ "$plugin" -eq 0 ]; then
            class=TEST
          elif [ "$plugin" -gt 0 ]; then
            class=PLUGIN
          fi

          ev=""
          case "$class" in
            INFRA)      ev=$(grep -E '^\[ERROR\]|^Caused by:' failed.log | grep -m1E 'Could not transfer|PKIX|Connection|timeout') ;;
            COMPILE)    ev=$(grep -m1 'COMPILATION ERROR' failed.log) ;;
            DEPENDENCY) ev=$(grep -m1E 'Could not resolve dependencies|Non-resolvable parent POM' failed.log) ;;
            TOOLCHAIN)  ev=$(grep -m1E 'UnsupportedClassVersionError|Unsupported major.minor version|invalid target release|No compiler is provided' failed.log) ;;
            TEST)       ev=$(grep -m1E 'Tests run: [0-9]+, Failures: [1-9]|Tests run: [0-9]+, Failures: 0, Errors: [1-9]' failed.log) ;;
            PLUGIN)     ev=$(grep -m1 'Failed to execute goal org.apache.maven.plugins:maven-' failed.log) ;;
          esac
          goal=$(grep -m1 -oE 'maven-[a-z0-9.-]+-plugin:[0-9.]+:[a-z-]+' failed.log)
          fe=$(grep -oE 'EXIT=-?[0-9]+' failed.log | tail -1)
          pe=$(grep -oE 'EXIT=-?[0-9]+' passed.log | tail -1)
          echo "tag=${{ matrix.tag }}"
          echo "class=$class"
          echo "goal=$goal"
          echo "evidence=$(printf '%s' "$ev" | head -c 200)"
          echo "failed_${fe:-EXIT=none}"
          echo "passed_${pe:-EXIT=none}"

      - uses: actions/upload-artifact@v4
        with:
          name: failed-log-${{ matrix.tag }}
          path: failed.log

      - uses: actions/upload-artifact@v4
        with:
          name: passed-log-${{ matrix.tag }}
          path: passed.log
