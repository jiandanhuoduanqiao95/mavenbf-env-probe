name: planb-build-smoke
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tag:
          - nutzam-nutz-89845306
          - ontop-ontop-83689235
          - orbit-orbit-237244974
          - pgjdbc-pgjdbc-392704645
          - raphw-byte-buddy-124133318
          - square-retrofit-81718047
          - square-wire-68744453
          - twilio-twilio-java-250536511
    steps:
      - name: pull (cached then fallback)
        run: |
          set +e
          echo "--- cached ---"
          docker pull bugswarm/cached-images:${{ matrix.tag }}
          c=$?
          echo "cached_exit=$c"
          img=""
          if [ "$c" -eq 0 ]; then
            img="bugswarm/cached-images:${{ matrix.tag }}"
            docker image inspect "$img" --format 'cached_size_bytes={{.Size}}' || true
          else
            echo "--- fallback ---"
            docker pull bugswarm/images:${{ matrix.tag }}
            f=$?
            echo "fallback_exit=$f"
            if [ "$f" -eq 0 ]; then
              img="bugswarm/images:${{ matrix.tag }}"
              docker image inspect "$img" --format 'fallback_size_bytes={{.Size}}' || true
            fi
          fi
          if [ -z "$img" ]; then
            echo "PULL_FAILED tag=${{ matrix.tag }}"
            exit 1
          fi
          echo "IMAGE=$img" >> "$GITHUB_ENV"

      - name: run_failed
        run: |
          set +e
          docker run --privileged --rm -i "$IMAGE" /bin/bash -lc 'bash /usr/local/bin/run_failed.sh; echo EXIT=$?' > failed.log 2>&1
          echo "docker_exit=$?"
          tail -60 failed.log

      - name: run_passed
        run: |
          set +e
          docker run --privileged --rm -i "$IMAGE" /bin/bash -lc 'bash /usr/local/bin/run_passed.sh; echo EXIT=$?' > passed.log 2>&1
          echo "docker_exit=$?"
          tail -60 passed.log

      - name: classify failed.log (priority rules v3)
        run: |
          set +e
          fe=$(grep -oE 'EXIT=-?[0-9]+' failed.log | tail -1 | sed 's/EXIT=//')
          class=UNKNOWN
          goal=""
          if [ "$fe" = "0" ]; then
            class=NOT_REPRODUCED
          elif [ "$fe" = "2" ] && grep -q 'Your build has been stopped' failed.log; then
            class=ABORTED
          else
            infra=$(grep -E '^\[ERROR\]|^Caused by:' failed.log | grep -vE '^\[ERROR\][[:space:]]*(symbol:|location:)|^\[ERROR\][[:space:]]*[^ ]*\.java:\[' | grep -cE 'Could not transfer|PKIX|Connection|timeout' || true)
            if [ "$infra" -gt 0 ]; then
              class=INFRA
            elif grep -q 'COMPILATION ERROR' failed.log; then
              class=COMPILE
            elif grep -qE 'maven-compiler-plugin:[0-9.]+:compile' failed.log && grep -q 'Compilation failure' failed.log; then
              class=COMPILE
            elif grep -qE 'Could not resolve dependencies|Non-resolvable parent POM' failed.log; then
              class=DEPENDENCY
            elif grep -qE 'UnsupportedClassVersionError|Unsupported major.minor version|invalid target release|No compiler is provided' failed.log; then
              class=TOOLCHAIN
            else
              fcg=$(grep -m1 'Failed to execute goal' failed.log)
              g=$(printf '%s' "$fcg" | grep -oE 'maven-(surefire|failsafe)-plugin:[0-9.]+:(test|verify)' | head -1)
              if [ -n "$g" ] && { grep -q 'There are test failures' failed.log || grep -qE 'Tests run: [0-9]+, Failures: [1-9]|Tests run: [0-9]+, Failures: 0, Errors: [1-9]' failed.log; }; then
                class=TEST
                goal=$g
              elif [ -n "$fcg" ]; then
                goal=$(printf '%s' "$fcg" | grep -oE '[A-Za-z0-9.-]+:[A-Za-z0-9.-]+:[0-9.]+:[a-zA-Z-]+' | head -1)
                case "$goal" in
                  *jacoco*:check) class=PLUGIN_QUALITY ;;
                  *) class=PLUGIN ;;
                esac
              fi
            fi
          fi
          ev=""
          case "$class" in
            NOT_REPRODUCED) ev=$(grep 'exited with 0' failed.log | tail -1) ;;
            ABORTED)        ev=$(grep -m1 'Your build has been stopped' failed.log) ;;
            INFRA)          ev=$(grep -E '^\[ERROR\]|^Caused by:' failed.log | grep -vE '^\[ERROR\][[:space:]]*(symbol:|location:)|^\[ERROR\][[:space:]]*[^ ]*\.java:\[' | grep -m1E 'Could not transfer|PKIX|Connection|timeout') ;;
            COMPILE)        ev=$(grep -m1 'COMPILATION ERROR' failed.log) ;;
            DEPENDENCY)     ev=$(grep -m1E 'Could not resolve dependencies|Non-resolvable parent POM' failed.log) ;;
            TOOLCHAIN)      ev=$(grep -m1E 'UnsupportedClassVersionError|Unsupported major.minor version|invalid target release|No compiler is provided' failed.log) ;;
            TEST)           ev=$(grep -m1 'There are test failures' failed.log) ;;
            PLUGIN|PLUGIN_QUALITY) ev=$(grep -m1 'Failed to execute goal' failed.log) ;;
          esac
          pe=$(grep -oE 'EXIT=-?[0-9]+' passed.log | tail -1)
          echo "tag=${{ matrix.tag }}"
          echo "class=$class"
          echo "goal=$goal"
          echo "evidence=$(printf '%s' "$ev" | head -c 200)"
          echo "failed_EXIT=${fe:-none}"
          echo "passed_${pe:-EXIT=none}"

      - uses: actions/upload-artifact@v4
        with:
          name: failed-log-${{ matrix.tag }}
          path: failed.log

      - uses: actions/upload-artifact@v4
        with:
          name: passed-log-${{ matrix.tag }}
          path: passed.log
